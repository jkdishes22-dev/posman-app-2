<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Posman Activator">
  <title>Posman Activator</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #4f8ef7;
      --accent-dim: #1a2a5a;
      --text: #e8e8f0;
      --text-dim: #7878aa;
      --danger: #e05555;
      --success: #2ecc71;
      --border: #2a2a4a;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      max-width: 480px;
      margin: 0 auto;
    }

    header { margin-bottom: 24px; }
    header h1 { font-size: 22px; font-weight: 700; color: var(--accent); }
    header p  { font-size: 13px; color: var(--text-dim); margin-top: 3px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-dim); opacity: 0.5; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 18px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .checkbox-row span { font-size: 13px; color: var(--text-dim); }

    .error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-ghost    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-size: 13px; padding: 10px; }
    .btn-danger   { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 13px; padding: 10px; }

    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn-row button { flex: 1; margin-top: 0; }

    /* ── Session badge ── */
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 18px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .lock-link { color: var(--text-dim); cursor: pointer; text-decoration: underline; }

    /* ── Result ── */
    .result-box {
      background: var(--surface2);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 28px 20px 20px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .result-label  { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
    .result-code   { font-size: 44px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--success); letter-spacing: 6px; margin-bottom: 8px; }
    .result-fp     { font-size: 12px; font-family: monospace; color: var(--text-dim); margin-bottom: 18px; }
    .copy-btn      { display: inline-block; padding: 9px 28px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: auto; transition: background 0.15s; }
    .copy-btn:active { background: var(--accent); color: #fff; }

    /* ── Log ── */
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .log-header .card-title { margin-bottom: 0; }
    .log-count { font-size: 12px; color: var(--text-dim); }

    .log-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 24px 0; }

    .log-item {
      border-top: 1px solid var(--border);
      padding: 12px 0;
      font-size: 13px;
    }
    .log-item:first-child { border-top: none; }
    .log-date  { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
    .log-lbl   { font-weight: 600; margin-bottom: 2px; }
    .log-fp    { font-family: monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
    .log-code  { font-family: monospace; font-weight: 700; color: var(--success); letter-spacing: 2px; }

    #passphrase-section { }
    #main-section { display: none; }
  </style>
</head>
<body>

<header>
  <h1>Posman Activator</h1>
  <p>Generate activation codes for licensed installations</p>
</header>

<!-- ── Passphrase ── -->
<div id="passphrase-section">
  <div class="card">
    <div class="card-title">Unlock</div>
    <label for="passphrase">Master Passphrase</label>
    <input type="password" id="passphrase" placeholder="Enter your passphrase"
           autocomplete="off" onkeydown="if(event.key==='Enter') unlockWithPassphrase()">
    <div id="passphrase-error" class="error"></div>
    <div class="checkbox-row" onclick="document.getElementById('remember-session').click()">
      <input type="checkbox" id="remember-session" checked onclick="event.stopPropagation()">
      <span>Remember until browser closes</span>
    </div>
    <button class="btn-primary" onclick="unlockWithPassphrase()">Unlock</button>
  </div>
</div>

<!-- ── Main ── -->
<div id="main-section">

  <div class="session-badge">
    <span class="dot"></span>
    <span>Session active</span>
    <span>&nbsp;·&nbsp;</span>
    <span class="lock-link" onclick="lockSession()">Lock</span>
  </div>

  <!-- Generate -->
  <div class="card">
    <div class="card-title">Generate Code</div>
    <label for="fingerprint">Installation ID (from technician)</label>
    <input type="text" id="fingerprint" placeholder="A3F8-82XX-KL9M"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
           oninput="this.value = this.value.toUpperCase()"
           onkeydown="if(event.key==='Enter') generateCode()">
    <label for="client-label">Label (optional)</label>
    <input type="text" id="client-label" placeholder="e.g. Mama Lucy Cafe, Nairobi"
           autocomplete="off" onkeydown="if(event.key==='Enter') generateCode()">
    <div id="generate-error" class="error"></div>
    <button class="btn-primary" style="margin-top:16px" onclick="generateCode()">Generate Activation Code</button>
  </div>

  <!-- Result -->
  <div class="result-box" id="result-box">
    <div class="result-label">Activation Code</div>
    <div class="result-code" id="result-code"></div>
    <div class="result-fp" id="result-fp"></div>
    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="log-header">
      <div class="card-title">Activation Log</div>
      <span class="log-count" id="log-count">0 records</span>
    </div>
    <div id="log-list">
      <div class="log-empty">No activations yet</div>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" onclick="exportLog()">Export CSV</button>
      <button class="btn-danger" onclick="clearLog()">Clear Log</button>
    </div>
  </div>

</div>

<script>
  // ── Constants ──────────────────────────────────────────────────────────────
  const SALT    = new TextEncoder().encode("posman-activator-v1");
  const LOG_KEY = "posman_activation_log";

  // ── State ──────────────────────────────────────────────────────────────────
  let derivedKey = null;

  // ── Key derivation ─────────────────────────────────────────────────────────
  async function deriveKey(passphrase) {
    const raw = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passphrase),
      "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: SALT, iterations: 200000, hash: "SHA-256" },
      raw,
      { name: "HMAC", hash: "SHA-256" },
      false, ["sign"]
    );
  }

  // ── HMAC → 8-digit code ────────────────────────────────────────────────────
  async function hmacCode(fingerprint) {
    const sig  = await crypto.subtle.sign("HMAC", derivedKey, new TextEncoder().encode(fingerprint));
    const view = new DataView(sig);
    // Use first 4 bytes for 8-digit code (0–99 999 999)
    const num  = view.getUint32(0) % 100_000_000;
    return num.toString().padStart(8, "0");
  }

  // ── Unlock ─────────────────────────────────────────────────────────────────
  async function unlockWithPassphrase() {
    const pp    = document.getElementById("passphrase").value;
    const errEl = document.getElementById("passphrase-error");
    errEl.style.display = "none";

    if (!pp.trim()) {
      showError(errEl, "Passphrase is required.");
      return;
    }

    const btn = document.querySelector("#passphrase-section .btn-primary");
    btn.disabled = true;
    btn.textContent = "Deriving key…";

    try {
      derivedKey = await deriveKey(pp);
      if (document.getElementById("remember-session").checked) {
        sessionStorage.setItem("posman_pp", pp);
      }
      showMain();
    } catch {
      showError(errEl, "Failed to derive key. Please try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  }

  function lockSession() {
    sessionStorage.removeItem("posman_pp");
    derivedKey = null;
    document.getElementById("passphrase").value = "";
    document.getElementById("main-section").style.display   = "none";
    document.getElementById("passphrase-section").style.display = "block";
    document.getElementById("result-box").style.display     = "none";
  }

  function showMain() {
    document.getElementById("passphrase-section").style.display = "none";
    document.getElementById("main-section").style.display       = "block";
    renderLog();
  }

  // ── Generate ───────────────────────────────────────────────────────────────
  async function generateCode() {
    const raw   = document.getElementById("fingerprint").value.trim();
    const label = document.getElementById("client-label").value.trim();
    const errEl = document.getElementById("generate-error");
    errEl.style.display = "none";

    if (!raw) { showError(errEl, "Installation ID is required."); return; }

    // Normalise: strip separators, uppercase
    const fingerprint = raw.replace(/[-\s]/g, "").toUpperCase();

    if (fingerprint.length < 6) {
      showError(errEl, "Installation ID looks too short.");
      return;
    }

    const btn = document.querySelector("#main-section .btn-primary");
    btn.disabled = true;
    btn.textContent = "Generating…";

    try {
      const code        = await hmacCode(fingerprint);
      const displayCode = code.slice(0, 4) + "-" + code.slice(4);

      document.getElementById("result-code").textContent = displayCode;
      document.getElementById("result-fp").textContent   = fmtFp(fingerprint);
      document.getElementById("result-box").style.display = "block";

      saveToLog({ fingerprint, displayCode, label, date: new Date().toISOString() });
      renderLog();

      document.getElementById("fingerprint").value   = "";
      document.getElementById("client-label").value  = "";
    } catch {
      showError(errEl, "Failed to generate code. Session may have expired.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate Activation Code";
    }
  }

  // ── Copy ───────────────────────────────────────────────────────────────────
  async function copyCode() {
    const code = document.getElementById("result-code").textContent.replace(/-/g, "");
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      // Fallback for browsers without clipboard API
      const ta = Object.assign(document.createElement("textarea"), { value: code });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    const btn = document.querySelector(".copy-btn");
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy Code", 1800);
  }

  // ── Log ────────────────────────────────────────────────────────────────────
  function getLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); }
    catch { return []; }
  }

  function saveToLog(entry) {
    const log = getLog();
    log.unshift(entry);
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }

  function renderLog() {
    const log       = getLog();
    const container = document.getElementById("log-list");
    const countEl   = document.getElementById("log-count");
    countEl.textContent = log.length === 1 ? "1 record" : `${log.length} records`;

    if (!log.length) {
      container.innerHTML = '<div class="log-empty">No activations yet</div>';
      return;
    }

    container.innerHTML = log.map(e => `
      <div class="log-item">
        <div class="log-date">${new Date(e.date).toLocaleString()}</div>
        ${e.label ? `<div class="log-lbl">${esc(e.label)}</div>` : ""}
        <div class="log-fp">${fmtFp(e.fingerprint)}</div>
        <div class="log-code">${e.displayCode}</div>
      </div>`
    ).join("");
  }

  function exportLog() {
    const log = getLog();
    if (!log.length) { alert("No activations to export."); return; }
    const rows = [["Date", "Label", "Installation ID", "Code"],
      ...log.map(e => [new Date(e.date).toLocaleString(), e.label || "", fmtFp(e.fingerprint), e.displayCode])
    ];
    const csv  = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const url  = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    Object.assign(document.createElement("a"), { href: url, download: `posman-activations-${Date.now()}.csv` }).click();
    URL.revokeObjectURL(url);
  }

  function clearLog() {
    if (!confirm("Clear all activation records? This cannot be undone.")) return;
    localStorage.removeItem(LOG_KEY);
    renderLog();
    document.getElementById("result-box").style.display = "none";
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function showError(el, msg) { el.textContent = msg; el.style.display = "block"; }
  function fmtFp(fp) { return (fp.match(/.{1,4}/g) ?? [fp]).join("-"); }
  function esc(s)    { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ── Auto-restore session on page load ─────────────────────────────────────
  (async () => {
    const saved = sessionStorage.getItem("posman_pp");
    if (!saved) return;
    try {
      derivedKey = await deriveKey(saved);
      showMain();
    } catch {
      sessionStorage.removeItem("posman_pp");
    }
  })();
</script>
</body>
</html>
