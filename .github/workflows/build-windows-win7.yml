name: Build Windows 7 Installer (Legacy x64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Legacy release version label (e.g., 1.0.10)"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease"
        required: false
        default: true
        type: boolean

jobs:
  build-win7:
    name: Build Win7 Legacy Installer (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      ELECTRON_VERSION: "22.3.27"

    steps:
      - name: Set build tags
        run: echo "LEGACY_TAG=win7-v${{ inputs.version }}" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-cache-win7-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'pages/**', 'electron/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cache-win7-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        # --ignore-scripts skips native module compilation (better-sqlite3, keytar).
        # Both are pinned to legacy-compatible versions and rebuilt explicitly in later steps.
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Patch electron-builder module collector (undefined path workaround)
        shell: pwsh
        run: |
          # electron-builder 26.x throws when a package's path is undefined in the npm tree
          # (happens for native deps like tree-sitter-json whose install script was skipped by
          # --ignore-scripts). The fix: replace the throw with `return acc` so the package is
          # silently skipped. Root node_modules are excluded from the app anyway (!node_modules/**/*).
          $file = "node_modules/app-builder-lib/out/node-module-collector/nodeModulesCollector.js"
          $content = Get-Content $file -Raw
          $patched = $content -replace 'throw new Error\("unable to parse `path` during `tree\.dependencies` reduce"\)', 'return acc'
          Set-Content $file $patched -NoNewline
          Write-Host "Patched nodeModulesCollector.js — undefined paths will be skipped"

      - name: Pin legacy desktop runtime dependencies
        shell: pwsh
        run: |
          npm install --no-save electron@$env:ELECTRON_VERSION better-sqlite3@8.7.0 keytar@7.9.0

      - name: Build Next.js in standalone mode
        run: npm run build
        env:
          ELECTRON_BUILD: "true"
          NODE_ENV: "production"
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'build-token' }}

      - name: Verify standalone build exists
        shell: pwsh
        run: |
          if (-not (Test-Path ".next\standalone\server.js")) {
            Write-Error "Standalone build not found"
            exit 1
          }

      - name: Rebuild keytar for legacy Electron
        shell: pwsh
        run: |
          # Rebuild in root node_modules where full source is available.
          # .next/standalone/node_modules only has the traced binary, not binding.gyp or source.
          npx --yes @electron/rebuild --module-dir "." --only keytar --arch x64 --version $env:ELECTRON_VERSION --force
          $srcBinary = "node_modules/keytar/build/Release/keytar.node"
          if (-not (Test-Path $srcBinary)) {
            Write-Error "keytar rebuild failed - binary not found at $srcBinary"
            exit 1
          }
          $destBinary = ".next/standalone/node_modules/keytar/build/Release/keytar.node"
          New-Item -ItemType Directory -Path (Split-Path $destBinary) -Force | Out-Null
          Copy-Item -Path $srcBinary -Destination $destBinary -Force
          Write-Host "keytar (Electron $env:ELECTRON_VERSION ABI) installed: $destBinary"

      - name: Rebuild better-sqlite3 for legacy Electron ABI
        shell: pwsh
        run: |
          # Rebuild at root (better-sqlite3@8.7.0 already installed there).
          # .next/standalone doesn't auto-include native modules, so we copy the full
          # package after rebuilding rather than trying to rebuild inside standalone.
          # This ensures the Electron-22 ABI (NMV 110) binary replaces the Node.js 18 one (NMV 108).
          Remove-Item -Recurse -Force "node_modules/better-sqlite3/build" -ErrorAction SilentlyContinue
          npx --yes @electron/rebuild --module-dir "." --only better-sqlite3 --arch x64 --version $env:ELECTRON_VERSION --force
          $srcBinary = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $srcBinary)) {
            Write-Error "better-sqlite3 rebuild failed - binary not found at $srcBinary"
            exit 1
          }
          Write-Host "better-sqlite3 rebuilt at root: $srcBinary"
          # Copy the full rebuilt package into standalone so it is available at runtime.
          $destDir = ".next/standalone/node_modules/better-sqlite3"
          if (Test-Path $destDir) { Remove-Item -Recurse -Force $destDir }
          Copy-Item -Recurse "node_modules/better-sqlite3" $destDir
          Write-Host "better-sqlite3 copied to standalone: $destDir"

      - name: Install undici v5 into standalone (Node 16 fetch polyfill)
        shell: pwsh
        run: |
          # Next.js 15 dropped its bundled undici (targets Node 18+ which has native fetch).
          # Electron 22 ships Node 16 which has no fetch globals — our ESM loader wrapper
          # polyfills them from this module before importing server.js.
          Push-Location ".next/standalone"
          npm install --no-save undici@5
          Pop-Location

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $cert = "${{ secrets.WINDOWS_CERTIFICATE }}"
          if ($cert) {
            $bytes = [Convert]::FromBase64String($cert)
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
            "CERT_PATH=$env:RUNNER_TEMP\cert.pfx" | Out-File -Append $env:GITHUB_ENV
            Write-Host "Certificate loaded"
          } else {
            Write-Host "No certificate secret found; producing unsigned installer"
          }

      # artifactName: use pwsh single quotes so ${arch}.${ext} are passed to electron-builder (not expanded/corrupted by PowerShell). Escaped \${arch} broke NSIS output paths (Can't open output file).
      - name: Build Win7 legacy NSIS installer
        shell: pwsh
        run: |
          npx electron-builder `
            --win --x64 `
            --config electron-builder.config.cjs `
            --config.npmRebuild=false `
            --config.win.artifactName='JK PosMan Setup ${{ inputs.version }}-win7-${arch}.${ext}' `
            --publish never
        env:
          NODE_ENV: "production"
          ELECTRON_VERSION: ${{ env.ELECTRON_VERSION }}
          BUILD_VERSION: ${{ env.LEGACY_TAG }}
          GH_TOKEN: ""
          ACTIVATION_PASSPHRASE: ${{ secrets.ACTIVATION_PASSPHRASE }}
          CSC_LINK: ${{ env.CERT_PATH }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Win7 installer output
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path dist-electron -Filter "*-win7-*.exe" -ErrorAction SilentlyContinue
          if ($exes.Count -eq 0) {
            Write-Error "No Win7-labeled installer produced"
            exit 1
          }
          $exes | ForEach-Object {
            Write-Host "Produced: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-installer-${{ inputs.version }}
          path: |
            dist-electron/*-win7-*.exe
            dist-electron/*-win7-*.exe.blockmap
          retention-days: 7

      - name: Create legacy release and attach installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LEGACY_TAG }}
          name: Windows 7 Legacy ${{ env.LEGACY_TAG }}
          files: |
            dist-electron/*-win7-*.exe
            dist-electron/*-win7-*.exe.blockmap
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            Legacy Windows 7 x64 installer line.
            - Support scope: security/critical fixes only
            - Channel: win7_branch
            - Electron: ${{ env.ELECTRON_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
